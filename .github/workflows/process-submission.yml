name: Process Wallpaper Submission

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-submission:
    if: contains(github.event.issue.title, 'Screensaver Submission')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Process Image, Generate Thumbnail, and Update Catalog
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - << 'EOF'
          import os, json, re, requests, time, sys
          from PIL import Image, ImageOps
          from io import BytesIO

          body = os.environ.get('ISSUE_BODY', '')
          issue_num = os.environ.get('ISSUE_NUM', '')
          github_output = os.environ.get('GITHUB_OUTPUT', '')

          def set_output(valid_bool):
              if github_output and os.path.exists(github_output):
                  with open(github_output, 'a', encoding='utf-8') as out:
                      out.write(f"valid={'true' if valid_bool else 'false'}\n")

          def write_failure_comment(reason):
              lines = [
                  "⚠️ **Wallpaper Submission Validation Failed**",
                  "",
                  "We could not process this wallpaper submission because it failed KOReader format and security checks:",
                  f"> Reason: {reason}",
                  "",
                  "**Requirements for KOReader Screensaver Wallpapers:**",
                  "* **Supported Formats:** Valid raster **JPG, PNG, or WebP** images only. Vector files (SVG), scripts, and executables are strictly rejected to prevent malware.",
                  "* **Resolution:** Minimum **200 × 200 px**, maximum **12,000 × 12,000 px**.",
                  "* **File Size:** Maximum **25 MB**.",
                  "",
                  "Please check the image and feel free to update the issue or open a new submission!"
              ]
              with open('issue_comment.md', 'w', encoding='utf-8') as f:
                  f.write('\n'.join(lines))
              set_output(False)
              sys.exit(0)

          title_match = re.search(r'\*\*Title:\*\*\s*(.*)', body)
          author_match = re.search(r'\*\*Author:\*\*\s*(.*)', body)
          category_match = re.search(r'\*\*Category:\*\*\s*(.*)', body)
          filename_match = re.search(r'\*\*(?:Filename|Replacement Filename):\*\*\s*(.*)', body)

          # Match markdown image ![alt](url), direct image URL, user-attachments, or URL in Image: field
          url_match_str = None

          # 1. Check Image: line for direct URL
          img_line = re.search(r'\*\*(?:Image|Replacement Image):\*\*\s*(.*)', body)
          if img_line:
              u = re.search(r'https?://[^\s\)\"]+', img_line.group(1))
              if u:
                  url_match_str = u.group(0)

          # 2. Check markdown image tag ![...](url)
          if not url_match_str:
              md_img = re.search(r'!\[.*?\]\((https?://[^\s\)]+)\)', body)
              if md_img:
                  url_match_str = md_img.group(1)

          # 3. Fallback: match any image/github URL in body
          if not url_match_str:
              any_url = re.search(r'https?://[^\s\)\"]+(?:user-attachments|\.png|\.jpg|\.jpeg|\.webp|ibb\.co|freeimage|imgur)[^\s\)\"]*', body, re.IGNORECASE)
              if any_url:
                  url_match_str = any_url.group(0)

          # 4. Final fallback: any URL in issue body
          if not url_match_str:
              any_url = re.search(r'https?://[^\s\)\"]+', body)
              if any_url:
                  url_match_str = any_url.group(0)

          if not (title_match and url_match_str):
              write_failure_comment("Could not extract a valid title and image URL from the issue body.")

          title = title_match.group(1).strip()
          author = author_match.group(1).strip() if author_match else "Community"
          category = category_match.group(1).strip() if category_match else "General"
          original_filename = filename_match.group(1).strip() if filename_match else "N/A"
          img_url = url_match_str.strip()

          item_id = re.sub(r'[^a-z0-9]+', '-', title.lower()).strip('-')
          if not item_id:
              item_id = f"screensaver-{int(time.time())}"

          # Prepare directories
          os.makedirs('images', exist_ok=True)
          os.makedirs('images/thumbnails', exist_ok=True)
          os.makedirs('images/thumbnails/plugin', exist_ok=True)

          # Detect transparent overlays (only when category is Transparent)
          is_transparent = (category.lower() == 'transparent')

          if is_transparent:
              full_path = f'images/{item_id}.png'
              thumb_web_path = f'images/thumbnails/{item_id}.png'          # Web: RGBA with alpha
              thumb_plugin_path = f'images/thumbnails/plugin/{item_id}.png' # Plugin: checkerboard-composited RGB
          else:
              full_path = f'images/{item_id}.jpg'
              thumb_web_path = f'images/thumbnails/{item_id}.jpg'
              thumb_plugin_path = None  # No plugin variant needed for opaque images

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
          max_retries = 3
          MAX_DOWNLOAD_BYTES = 25 * 1024 * 1024
          raw_data = bytearray()
          download_success = False

          for attempt in range(max_retries):
              try:
                  print(f"Downloading image from {img_url} (attempt {attempt + 1}/{max_retries})...")
                  with requests.get(img_url, headers=headers, allow_redirects=True, timeout=30, stream=True) as resp:
                      if resp.status_code != 200:
                          print(f"HTTP Status {resp.status_code}, retrying...")
                          time.sleep(2)
                          continue
                      
                      c_type = resp.headers.get('Content-Type', '').lower()
                      if any(bad in c_type for bad in ['svg', 'html', 'javascript', 'text', 'application/x-', 'application/pdf']):
                          write_failure_comment(f"Disallowed Content-Type '{c_type}'. SVG, HTML, and binary executables are not permitted.")

                      raw_data = bytearray()
                      for chunk in resp.iter_content(chunk_size=65536):
                          raw_data.extend(chunk)
                          if len(raw_data) > MAX_DOWNLOAD_BYTES:
                              write_failure_comment("Downloaded file exceeded the maximum 25 MB security limit.")
                      
                      download_success = True
                      break
              except Exception as exc:
                  print(f"Download attempt {attempt + 1} failed: {exc}")
                  if attempt < max_retries - 1:
                      time.sleep(2)

          if not download_success or len(raw_data) == 0:
              write_failure_comment("Failed to download image from the provided CDN / image URL after multiple attempts.")

          # Pillow Security & Integrity Validations
          Image.MAX_IMAGE_PIXELS = 50_000_000  # 50 MP max (decompression bomb protection)
          ALLOWED_FORMATS = {'JPEG', 'PNG', 'WEBP', 'MPO'}

          img_stream = BytesIO(raw_data)
          try:
              verify_img = Image.open(img_stream)
              detected_format = verify_img.format
              verify_img.verify()
          except Exception as val_err:
              write_failure_comment(f"Corrupted or invalid image structure: {val_err}")

          if detected_format not in ALLOWED_FORMATS:
              write_failure_comment(f"Format '{detected_format}' is not supported by KOReader. Only JPEG, PNG, and WebP are allowed.")

          # Re-open stream for full pixel raster decode
          img_stream.seek(0)
          try:
              img = Image.open(img_stream)
              img.load()
          except Exception as dec_err:
              write_failure_comment(f"Failed to decode image raster pixels: {dec_err}")

          if img.width < 200 or img.height < 200:
              write_failure_comment(f"Image resolution ({img.width} × {img.height} px) is too small. Minimum resolution is 200 × 200 px.")

          if img.width > 12000 or img.height > 12000:
              write_failure_comment(f"Image resolution ({img.width} × {img.height} px) exceeds 12,000 px limit.")

          CHECKERBOARD_TILE = 12
          CB_LIGHT = (255, 255, 255, 255)
          CB_DARK  = (210, 210, 210, 255)

          def make_checkerboard(w, h):
              bg = Image.new('RGBA', (w, h))
              pixels = bg.load()
              for y in range(h):
                  cy = y // CHECKERBOARD_TILE
                  for x in range(w):
                      cx = x // CHECKERBOARD_TILE
                      pixels[x, y] = CB_LIGHT if (cx + cy) % 2 == 0 else CB_DARK
              return bg

          def fit_transparent(img_rgba, target_w, target_h):
              """Proportionally fit an RGBA image into a transparent canvas of target_w x target_h."""
              canvas = Image.new('RGBA', (target_w, target_h), (0, 0, 0, 0))
              img_rgba.thumbnail((target_w, target_h), Image.Resampling.LANCZOS)
              x = (target_w - img_rgba.width) // 2
              y = (target_h - img_rgba.height) // 2
              canvas.paste(img_rgba, (x, y), img_rgba)
              return canvas

          def composite_over_checkerboard(img_rgba, target_w, target_h):
              """Composite RGBA image over a checkerboard background, return RGB."""
              bg = make_checkerboard(target_w, target_h)
              img_rgba.thumbnail((target_w, target_h), Image.Resampling.LANCZOS)
              x = (target_w - img_rgba.width) // 2
              y = (target_h - img_rgba.height) // 2
              bg.paste(img_rgba, (x, y), img_rgba)
              return bg.convert('RGB')

          # Re-rasterize onto clean fresh canvas (strips metadata, polyglots, and hidden chunks)
          if is_transparent:
              img_rgba = img.convert('RGBA')

              # Full-res master: transparent RGBA PNG (1860x2480)
              master_transparent = fit_transparent(img_rgba.copy(), 1860, 2480)
              master_transparent.save(full_path, 'PNG')

              # Web thumbnail: transparent RGBA PNG (600x800) — used by web catalog
              web_thumb = fit_transparent(img_rgba.copy(), 600, 800)
              web_thumb.save(thumb_web_path, 'PNG')

              # Plugin thumbnail: checkerboard-composited RGB PNG (600x800) — used by KOReader plugin
              plugin_thumb = composite_over_checkerboard(img_rgba.copy(), 600, 800)
              plugin_thumb.save(thumb_plugin_path, 'PNG')

              print(f"Transparent image processed: web thumb={thumb_web_path}, plugin thumb={thumb_plugin_path}")
          else:
              img_rgb = img.convert('RGB')

              # Full-res master: JPEG (1860x2480)
              master_img = ImageOps.fit(img_rgb, (1860, 2480), Image.Resampling.LANCZOS)
              master_img.save(full_path, 'JPEG', quality=92)

              # Thumbnail: JPEG (600x800)
              thumb_img = ImageOps.fit(img_rgb, (600, 800), Image.Resampling.LANCZOS)
              thumb_img.save(thumb_web_path, 'JPEG', quality=85)

              print(f"Opaque image processed: thumb={thumb_web_path}")

          raw_base = "https://raw.githubusercontent.com/ultimatejimmy/storefront-screensavers/main/"
          full_url = raw_base + full_path
          thumb_url = raw_base + thumb_web_path
          plugin_thumb_url = (raw_base + thumb_plugin_path) if thumb_plugin_path else thumb_url

          with open('screensavers.json', 'r') as f:
              catalog = json.load(f)

          new_entry = {
              "id": item_id,
              "title": title,
              "author": author,
              "category": category,
              "compatibility": ["Kindle", "Kobo", "Boox"],
              "thumbnailUrl": thumb_url,
              "pluginThumbnailUrl": plugin_thumb_url,
              "fullUrl": full_url,
              "downloads": 0,
              "likes": 0
          }

          # Check if id exists and update, or append
          updated = False
          for idx, item in enumerate(catalog):
              if item['id'] == item_id:
                  catalog[idx] = new_entry
                  updated = True
                  break
          if not updated:
              catalog.append(new_entry)

          with open('screensavers.json', 'w') as f:
              json.dump(catalog, f, indent=2)

          # Generate rich PR body markdown file with visual image preview
          pr_lines = [
              f"Closes #{issue_num}",
              "",
              f"### Screensaver Submission: {title}",
              "",
              "| Property | Value |",
              "|---|---|",
              f"| **Title** | {title} |",
              f"| **Author** | {author} |",
              f"| **Category** | {category} |",
              f"| **Original Filename** | `{original_filename}` |",
              f"| **Target Item ID** | `{item_id}` |",
              f"| **Master Image** | `{full_path}` (1860 × 2480) |",
              f"| **Thumbnail** | `{thumb_web_path}` (600 × 800) |",
              "",
              "### Visual Preview",
              f"![{title}]({img_url})",
              "",
              "---",
              f"*Automated PR generated from issue #{issue_num} via Storefront Screensaver Catalog workflow.*"
          ]
          with open('pr_body.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(pr_lines))

          # Generate rich issue comment body markdown file with visual image preview
          comment_lines = [
              "🎉 **Submission Received & Verified!**",
              "",
              "An automated Pull Request containing the clean, formatted full-resolution wallpaper (1860 × 2480) and thumbnail has been created.",
              "",
              f"### Submitted Wallpaper: {title}",
              "| Property | Value |",
              "|---|---|",
              f"| **Title** | {title} |",
              f"| **Author** | {author} |",
              f"| **Category** | {category} |",
              f"| **Original Filename** | `{original_filename}` |",
              "",
              "### Visual Preview",
              f"![{title}]({img_url})",
              "",
              "**Review Status:** Pending maintainer review & approval. Once approved and merged into `main`, the wallpaper will immediately appear in the web catalog and KOReader Storefront plugin!"
          ]
          with open('issue_comment.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(comment_lines))

          set_output(True)
          print(f"Successfully processed and generated thumbnail for: {title}")
          EOF


      - name: Create Pull Request
        if: steps.process.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="submission-${ISSUE_NUM}"
          
          # Remove stale remote branch if present
          git push origin --delete "${BRANCH_NAME}" || true
          
          # Create fresh clean branch from current HEAD
          git checkout -b "${BRANCH_NAME}"
          
          # Stage exclusively image assets and catalog json
          git add images/ screensavers.json
          git commit -m "Add screensaver and thumbnail for issue #${ISSUE_NUM}"
          
          # Push clean branch
          git push origin "${BRANCH_NAME}" --force
          
          # Create Pull Request using gh CLI
          gh pr create \
            --title "New Screensaver Submission: ${ISSUE_TITLE}" \
            --body-file pr_body.md \
            --head "${BRANCH_NAME}" \
            --base "main" || true

      - name: Comment on Issue
        if: steps.process.outputs.valid == 'true' || steps.process.outputs.valid == 'false'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body-path: 'issue_comment.md'
