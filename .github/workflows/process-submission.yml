name: Process Wallpaper Submission

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-submission:
    if: (contains(github.event.issue.title, 'Screensaver Submission') || contains(github.event.issue.title, 'screensaver') || contains(github.event.issue.title, 'Screensaver') || contains(github.event.issue.title, 'Wallpaper') || contains(github.event.issue.title, 'wallpaper') || contains(github.event.issue.labels.*.name, 'screensaver') || contains(github.event.issue.labels.*.name, 'submission')) && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Process Images, Generate Thumbnails, and Prepare Catalog
        id: process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - << 'EOF'
          import os, json, re, requests, time, sys
          from io import BytesIO
          from urllib.parse import urljoin
          from PIL import Image, ImageOps

          body = os.environ.get('ISSUE_BODY', '')
          issue_num = os.environ.get('ISSUE_NUM', '')
          github_output = os.environ.get('GITHUB_OUTPUT', '')
          token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', 'ultimatejimmy/storefront-screensavers')

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'image/webp,image/apng,image/*,*/*;q=0.8'
          }
          max_retries = 3
          MAX_DOWNLOAD_BYTES = 25 * 1024 * 1024
          Image.MAX_IMAGE_PIXELS = 50_000_000
          ALLOWED_FORMATS = {'JPEG', 'PNG', 'WEBP', 'MPO'}

          def set_output(valid_bool):
              if github_output and os.path.exists(github_output):
                  with open(github_output, 'a', encoding='utf-8') as out:
                      out.write(f"valid={'true' if valid_bool else 'false'}\n")

          def write_failure_comment(reason):
              lines = [
                  "⚠️ **Wallpaper Submission Validation Failed**",
                  "",
                  "We could not process this wallpaper submission because it failed KOReader format and security checks:",
                  f"> Reason: {reason}",
                  "",
                  "**Requirements for KOReader Screensaver Wallpapers:**",
                  "* **Supported Formats:** Valid raster **JPG, PNG, or WebP** images only. Vector files (SVG), scripts, and executables are strictly rejected to prevent malware.",
                  "* **Resolution:** Minimum **200 × 200 px**, maximum **12,000 × 12,000 px**.",
                  "* **File Size:** Maximum **25 MB**.",
                  "",
                  "**How to fix:** You can edit the issue description or reply directly in the comments by attaching/pasting the image file (Ctrl+V / Cmd+V)!"
              ]
              with open('issue_comment.md', 'w', encoding='utf-8') as f:
                  f.write('\n'.join(lines))
              set_output(False)
              sys.exit(0)

          # Parse single or batch submission blocks
          blocks = re.split(r'(?=####\s+Wallpaper|\n---\s*\n####\s+Wallpaper|\n###\s+Wallpaper|\n###\s+Screensaver\s+Submission)', body)
          raw_entries = []

          for block in blocks:
              title_match = re.search(r'\*\*Title:\*\*\s*(.*)', block)
              if not title_match:
                  continue
              author_match = re.search(r'\*\*Author:\*\*\s*(.*)', block)
              category_match = re.search(r'\*\*Category:\*\*\s*(.*)', block)
              filename_match = re.search(r'\*\*(?:Filename|Replacement Filename):\*\*\s*(.*)', block)
              tags_match = re.search(r'\*\*Tags:\*\*\s*(.*)', block)

              url_match_str = None
              img_line = re.search(r'\*\*(?:Image|Replacement Image):\*\*\s*(.*)', block)
              if img_line:
                  u = re.search(r'https?://[^\s\)\"]+', img_line.group(1))
                  if u: url_match_str = u.group(0)

              if not url_match_str:
                  md_img = re.search(r'!\[.*?\]\((https?://[^\s\)]+)\)', block)
                  if md_img: url_match_str = md_img.group(1)

              if not url_match_str:
                  html_img = re.search(r'<img[^>]+src=["\'](https?://[^"\']+)["\']', block, re.IGNORECASE)
                  if html_img: url_match_str = html_img.group(1)

              if not url_match_str:
                  any_url = re.search(r'https?://[^\s\)\"]+(?:user-attachments|\.png|\.jpg|\.jpeg|\.webp|catbox|tmpfiles|freeimage|imgbb|imgur|postimg)[^\s\)\"]*', block, re.IGNORECASE)
                  if any_url: url_match_str = any_url.group(0)

              raw_entries.append({
                  'title': title_match.group(1).strip(),
                  'author': author_match.group(1).strip() if author_match else "Community",
                  'category': category_match.group(1).strip() if category_match else "General",
                  'original_filename': filename_match.group(1).strip() if filename_match else "N/A",
                  'tags': tags_match.group(1).strip() if tags_match else "",
                  'img_url': url_match_str.strip() if url_match_str else None
              })

          # Fallback check on issue comments if any submission lacked URL
          missing_entries = [e for e in raw_entries if not e['img_url']]
          if missing_entries:
              available_comment_urls = []
              comment_body = os.environ.get('COMMENT_BODY', '')
              if comment_body:
                  for u in re.findall(r'!\[.*?\]\((https?://[^\s\)]+)\)|(https?://[^\s\)\"]+(?:user-attachments|\.png|\.jpg|\.jpeg|\.webp|catbox|tmpfiles|freeimage|imgbb|imgur|postimg)[^\s\)\"]*)', comment_body, re.IGNORECASE):
                      url_found = u[0] or u[1]
                      if url_found and url_found not in available_comment_urls:
                          available_comment_urls.append(url_found)

              if token and issue_num:
                  try:
                      headers_gh = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json', 'User-Agent': headers['User-Agent']}
                      comments_resp = requests.get(f'https://api.github.com/repos/{repo}/issues/{issue_num}/comments', headers=headers_gh, timeout=10)
                      if comments_resp.status_code == 200:
                          for c in comments_resp.json():
                              c_txt = c.get('body', '')
                              if 'Wallpaper Submission Validation Failed' in c_txt or 'Submission Received & Verified' in c_txt:
                                  continue
                              for u in re.findall(r'!\[.*?\]\((https?://[^\s\)]+)\)|(https?://[^\s\)\"]+(?:user-attachments|\.png|\.jpg|\.jpeg|\.webp|catbox|tmpfiles|freeimage|imgbb|imgur|postimg)[^\s\)\"]*)', c_txt, re.IGNORECASE):
                                  url_found = u[0] or u[1]
                                  if url_found and url_found not in available_comment_urls:
                                      available_comment_urls.append(url_found)
                  except Exception as err:
                      print(f"Failed fetching issue comments: {err}")

              for e in raw_entries:
                  if not e['img_url'] and available_comment_urls:
                      e['img_url'] = available_comment_urls.pop(0)

          if not raw_entries:
              write_failure_comment("Could not extract any valid wallpaper titles and image URLs from the issue body.")

          # Prepare directories
          os.makedirs('images', exist_ok=True)
          os.makedirs('images/thumbnails', exist_ok=True)
          os.makedirs('images/thumbnails/plugin', exist_ok=True)

          CHECKERBOARD_TILE = 12
          CB_LIGHT = (255, 255, 255, 255)
          CB_DARK  = (210, 210, 210, 255)

          def make_checkerboard(w, h):
              bg = Image.new('RGBA', (w, h))
              pixels = bg.load()
              for y in range(h):
                  cy = y // CHECKERBOARD_TILE
                  for x in range(w):
                      cx = x // CHECKERBOARD_TILE
                      pixels[x, y] = CB_LIGHT if (cx + cy) % 2 == 0 else CB_DARK
              return bg

          def fit_transparent(img_rgba, target_w, target_h):
              canvas = Image.new('RGBA', (target_w, target_h), (0, 0, 0, 0))
              img_rgba.thumbnail((target_w, target_h), Image.Resampling.LANCZOS)
              x = (target_w - img_rgba.width) // 2
              y = (target_h - img_rgba.height) // 2
              canvas.paste(img_rgba, (x, y), img_rgba)
              return canvas

          def composite_over_checkerboard(img_rgba, target_w, target_h):
              bg = make_checkerboard(target_w, target_h)
              img_rgba.thumbnail((target_w, target_h), Image.Resampling.LANCZOS)
              x = (target_w - img_rgba.width) // 2
              y = (target_h - img_rgba.height) // 2
              bg.paste(img_rgba, (x, y), img_rgba)
              return bg.convert('RGB')

          def download_and_resolve_image(img_url, title):
              """
              Downloads image from direct link or resolves HTML landing pages (tmpfiles, imgbb, freeimage, catbox, etc.)
              Returns (raw_bytes, error_message)
              """
              session = requests.Session()
              session.headers.update(headers)
              if 'github.com/user-attachments' in img_url and token:
                  session.headers['Authorization'] = f'token {token}'

              for attempt in range(max_retries):
                  try:
                      print(f"Downloading '{title}' from {img_url} (attempt {attempt + 1}/{max_retries})...")
                      resp = session.get(img_url, allow_redirects=True, timeout=35)
                      if resp.status_code == 404:
                          return None, f"404 Not Found: Link expired or invalid on host ({img_url})"
                      if resp.status_code != 200:
                          time.sleep(2)
                          continue

                      c_type = resp.headers.get('Content-Type', '').lower()
                      is_html = ('text/html' in c_type) or resp.content.strip().startswith(b'<!DOCTYPE') or resp.content.strip().startswith(b'<html')

                      if is_html:
                          print(f"URL returned HTML landing page. Parsing HTML to extract direct image stream...")
                          html_text = resp.text

                          # Regex patterns for common image hosting pages
                          patterns = [
                              r'<img[^>]+id=["\']img_preview["\'][^>]+src=["\']([^"\']+)["\']',
                              r'<a[^>]+class=["\']download["\'][^>]+href=["\']([^"\']+)["\']',
                              r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',
                              r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)["\']',
                              r'<img[^>]+src=["\'](https?://[^"\']+\.(?:png|jpg|jpeg|webp))["\']',
                              r'["\'](https?://[^\s"\']+/dl/[^\s"\']+)["\']',
                          ]
                          extracted_url = None
                          for pat in patterns:
                              m = re.search(pat, html_text, re.IGNORECASE)
                              if m:
                                  found_target = m.group(1)
                                  if not found_target.startswith('http'):
                                      found_target = urljoin(img_url, found_target)
                                  if found_target != img_url:
                                      extracted_url = found_target
                                      break

                          if extracted_url:
                              print(f"Resolved direct image URL: {extracted_url}")
                              dl_resp = session.get(extracted_url, allow_redirects=True, timeout=35)
                              if dl_resp.status_code == 200:
                                  if len(dl_resp.content) > MAX_DOWNLOAD_BYTES:
                                      return None, "File size exceeded 25 MB limit."
                                  return dl_resp.content, None
                              else:
                                  return None, f"Resolved direct URL returned HTTP status {dl_resp.status_code}."
                          else:
                              return None, "Provided link is an HTML webpage rather than a direct image, and no image could be extracted."

                      if len(resp.content) > MAX_DOWNLOAD_BYTES:
                          return None, "File size exceeded 25 MB limit."

                      return resp.content, None
                  except Exception as exc:
                      print(f"Download attempt {attempt + 1} error: {exc}")
                      if attempt < max_retries - 1:
                          time.sleep(2)

              return None, "Failed to download image after multiple attempts."

          processed_items = []
          validation_errors = []
          used_ids = set()

          for idx, entry in enumerate(raw_entries):
              title = entry['title']
              author = entry['author']
              category = entry['category']
              original_filename = entry['original_filename']
              sub_tags = entry['tags']
              img_url = entry['img_url']

              if not img_url:
                  validation_errors.append(f"'{title}': Missing image URL. Please attach or link the image file.")
                  continue

              base_id = re.sub(r'[^a-z0-9]+', '-', title.lower()).strip('-')
              if not base_id:
                  base_id = f"screensaver-{int(time.time())}-{idx+1}"

              item_id = base_id
              suffix = 2
              while item_id in used_ids:
                  item_id = f"{base_id}-{suffix}"
                  suffix += 1
              used_ids.add(item_id)

              raw_data, dl_err = download_and_resolve_image(img_url, title)
              if dl_err or not raw_data or len(raw_data) == 0:
                  validation_errors.append(f"'{title}': {dl_err or 'Failed to download image'}")
                  continue

              # Security check: strictly reject vector SVG / XML / executable scripts
              raw_lead = raw_data[:512].lower()
              if raw_data.strip().startswith(b'<?xml') or b'<svg' in raw_lead or b'<script' in raw_lead:
                  validation_errors.append(f"'{title}': Disallowed vector SVG/script file. Only raster JPG, PNG, or WebP images are permitted.")
                  continue

              img_stream = BytesIO(raw_data)
              try:
                  verify_img = Image.open(img_stream)
                  detected_format = verify_img.format
                  verify_img.verify()
              except Exception as val_err:
                  validation_errors.append(f"'{title}': Corrupted image file structure ({val_err}).")
                  continue

              if detected_format not in ALLOWED_FORMATS:
                  validation_errors.append(f"'{title}': Unsupported image format '{detected_format}'. Please upload JPG, PNG, or WebP.")
                  continue

              img_stream.seek(0)
              try:
                  img = Image.open(img_stream)
                  img.load()
                  # Automatically correct camera / phone EXIF rotation
                  img = ImageOps.exif_transpose(img)
              except Exception as dec_err:
                  validation_errors.append(f"'{title}': Failed to decode image raster pixels ({dec_err}).")
                  continue

              if img.width < 200 or img.height < 200:
                  validation_errors.append(f"'{title}': Resolution ({img.width}×{img.height} px) is too small (minimum 200×200 px).")
                  continue

              if img.width > 12000 or img.height > 12000:
                  validation_errors.append(f"'{title}': Resolution ({img.width}×{img.height} px) exceeds maximum limit of 12,000 px.")
                  continue

              # Transparency detection
              has_trans_tag = ('transparent' in category.lower()) or ('transparent' in sub_tags.lower())
              has_alpha_channel = ('A' in img.getbands()) or (img.mode in ('RGBA', 'LA')) or ('transparency' in img.info)
              has_real_transparency = False
              if has_alpha_channel:
                  rgba_check = img.convert('RGBA')
                  min_a, max_a = rgba_check.split()[-1].getextrema()
                  if min_a < 250:
                      has_real_transparency = True

              is_transparent = has_trans_tag or has_real_transparency

              if is_transparent:
                  full_path = f'images/{item_id}.png'
                  thumb_web_path = f'images/thumbnails/{item_id}.png'
                  thumb_plugin_path = f'images/thumbnails/plugin/{item_id}.png'

                  img_rgba = img.convert('RGBA')
                  master_transparent = fit_transparent(img_rgba.copy(), 1860, 2480)
                  master_transparent.save(full_path, 'PNG')

                  web_thumb = fit_transparent(img_rgba.copy(), 600, 800)
                  web_thumb.save(thumb_web_path, 'PNG')

                  plugin_thumb = composite_over_checkerboard(img_rgba.copy(), 600, 800)
                  plugin_thumb.save(thumb_plugin_path, 'PNG')
              else:
                  full_path = f'images/{item_id}.jpg'
                  thumb_web_path = f'images/thumbnails/{item_id}.jpg'
                  thumb_plugin_path = None

                  img_rgb = img.convert('RGB')
                  master_img = ImageOps.fit(img_rgb, (1860, 2480), Image.Resampling.LANCZOS)
                  master_img.save(full_path, 'JPEG', quality=92)

                  thumb_img = ImageOps.fit(img_rgb, (600, 800), Image.Resampling.LANCZOS)
                  thumb_img.save(thumb_web_path, 'JPEG', quality=85)

              raw_base = "https://raw.githubusercontent.com/ultimatejimmy/storefront-screensavers/main/"
              full_url = raw_base + full_path
              thumb_url = raw_base + thumb_web_path
              plugin_thumb_url = (raw_base + thumb_plugin_path) if thumb_plugin_path else thumb_url

              cat_list = [c.strip() for c in category.split(',')] if isinstance(category, str) else list(category)
              if is_transparent and 'Transparent' not in cat_list and 'transparent' not in cat_list:
                  cat_list.append('Transparent')

              tag_list = [t.strip() for t in sub_tags.split(',')] if sub_tags else []
              if is_transparent and 'transparent' not in tag_list:
                  tag_list.append('transparent')

              cat_entry = {
                  "id": item_id,
                  "title": title,
                  "author": author,
                  "category": cat_list if len(cat_list) > 1 else (cat_list[0] if cat_list else "General"),
                  "compatibility": ["Kindle", "Kobo", "Boox"],
                  "thumbnailUrl": thumb_url,
                  "pluginThumbnailUrl": plugin_thumb_url,
                  "fullUrl": full_url,
                  "downloads": 0,
                  "likes": 0,
                  "tags": tag_list
              }

              processed_items.append({
                  'item_id': item_id,
                  'title': title,
                  'author': author,
                  'category': category,
                  'original_filename': original_filename,
                  'tags': sub_tags,
                  'img_url': img_url,
                  'is_transparent': is_transparent,
                  'full_path': full_path,
                  'thumb_web_path': thumb_web_path,
                  'thumb_plugin_path': thumb_plugin_path,
                  'catalog_entry': cat_entry
              })
              print(f"Successfully validated & prepared screensaver: '{title}' ({item_id})")

          if not processed_items:
              err_summary = "\n".join([f"- {e}" for e in validation_errors]) if validation_errors else "All submitted images failed validation checks."
              write_failure_comment(f"Validation failed for submitted images:\n{err_summary}")

          # Save processed items and remaining validation errors
          with open('processed_items.json', 'w', encoding='utf-8') as pf:
              json.dump({
                  'processed_items': processed_items,
                  'validation_errors': validation_errors
              }, pf, indent=2)

          set_output(True)
          print(f"Validation complete: {len(processed_items)} items approved for PR generation ({len(validation_errors)} items had issues).")
          EOF


      - name: Create Pull Requests
        if: steps.process.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          python - << 'PYEOF'
          import json, os, subprocess

          with open('processed_items.json', 'r', encoding='utf-8') as f:
              bundle = json.load(f)

          items = bundle.get('processed_items', [])
          validation_errors = bundle.get('validation_errors', [])

          issue_num = os.environ.get('ISSUE_NUM', '')
          created_prs = []

          for idx, item in enumerate(items):
              item_id = item['item_id']
              title = item['title']
              author = item['author']
              category = item['category']
              original_filename = item['original_filename']
              img_url = item['img_url']
              full_path = item['full_path']
              thumb_web_path = item['thumb_web_path']
              thumb_plugin_path = item.get('thumb_plugin_path')
              cat_entry = item['catalog_entry']

              if len(items) == 1:
                  branch = f"submission-{issue_num}"
              else:
                  branch = f"submission-{issue_num}-{idx + 1}"

              # Fetch latest origin/main to re-apply on top cleanly
              subprocess.run('git fetch origin main', shell=True, check=True)
              subprocess.run(f'git checkout -B {branch} origin/main', shell=True, check=True)

              # Update screensavers.json with this item
              with open('screensavers.json', 'r', encoding='utf-8') as sf:
                  curr_main = json.load(sf)

              updated = False
              for i, c in enumerate(curr_main):
                  if c['id'] == item_id:
                      curr_main[i] = cat_entry
                      updated = True
                      break
              if not updated:
                  curr_main.append(cat_entry)

              with open('screensavers.json', 'w', encoding='utf-8') as sf:
                  json.dump(curr_main, sf, indent=2, ensure_ascii=False)

              # Stage files
              files_to_add = [full_path, thumb_web_path, 'screensavers.json']
              if thumb_plugin_path and os.path.exists(thumb_plugin_path):
                  files_to_add.append(thumb_plugin_path)

              subprocess.run(f"git add {' '.join(files_to_add)}", shell=True, check=True)
              subprocess.run(f"git commit -m \"Add screensaver '{title}' for issue #{issue_num}\"", shell=True, check=True)
              subprocess.run(f"git push origin {branch} --force", shell=True, check=True)

              # Write PR body
              pr_lines = [
                  f"Closes #{issue_num}" if len(items) == 1 or idx == len(items) - 1 else f"Related to #{issue_num}",
                  "",
                  f"### Screensaver Submission: {title}",
                  "",
                  "| Property | Value |",
                  "|---|---|",
                  f"| **Title** | {title} |",
                  f"| **Author** | {author} |",
                  f"| **Category** | {category} |",
                  f"| **Original Filename** | `{original_filename}` |",
                  f"| **Target Item ID** | `{item_id}` |",
                  f"| **Master Image** | `{full_path}` (1860 × 2480) |",
                  f"| **Thumbnail** | `{thumb_web_path}` (600 × 800) |",
                  "",
                  "### Visual Preview",
                  f"![{title}]({img_url})",
                  "",
                  "---",
                  f"*Automated PR generated from issue #{issue_num} via Storefront Screensaver Catalog workflow.*"
              ]
              with open('pr_body_tmp.md', 'w', encoding='utf-8') as pf:
                  pf.write('\n'.join(pr_lines))

              pr_cmd = [
                  'gh', 'pr', 'create',
                  '--title', f"New Screensaver Submission: {title}",
                  '--body-file', 'pr_body_tmp.md',
                  '--head', branch,
                  '--base', 'main'
              ]
              try:
                  pr_out = subprocess.check_output(pr_cmd, text=True).strip()
                  created_prs.append({
                      'title': title,
                      'author': author,
                      'category': category,
                      'pr_url': pr_out,
                      'img_url': img_url
                  })
                  print(f"Created PR for '{title}': {pr_out}")
              except subprocess.CalledProcessError as pr_err:
                  print(f"PR creation returned non-zero (might already exist): {pr_err}")
                  created_prs.append({
                      'title': title,
                      'author': author,
                      'category': category,
                      'pr_url': f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'ultimatejimmy/storefront-screensavers')}/pulls",
                      'img_url': img_url
                  })

          # Generate issue comment
          if len(created_prs) == 1 and not validation_errors:
              p = created_prs[0]
              comment_lines = [
                  "🎉 **Submission Received & Verified!**",
                  "",
                  f"An automated Pull Request has been created: [{p['title']}]({p['pr_url']})",
                  "",
                  f"### Submitted Wallpaper: {p['title']}",
                  "| Property | Value |",
                  "|---|---|",
                  f"| **Title** | {p['title']} |",
                  f"| **Author** | {p['author']} |",
                  f"| **Category** | {p['category']} |",
                  f"| **Pull Request** | [View PR]({p['pr_url']}) |",
                  "",
                  "### Visual Preview",
                  f"![{p['title']}]({p['img_url']})",
                  "",
                  "**Review Status:** Pending maintainer review & approval. Once approved and merged into `main`, the wallpaper will immediately appear in the web catalog and KOReader Storefront plugin!"
              ]
          else:
              comment_lines = [
                  f"🎉 **Batch Submission Received & Verified! ({len(created_prs)} Wallpaper{'s' if len(created_prs) > 1 else ''})**",
                  "",
                  "Individual automated Pull Requests have been created for each verified wallpaper in this batch:",
                  "",
                  "| # | Wallpaper | Author | Category | Pull Request |",
                  "|---|---|---|---|---|"
              ]
              for idx, p in enumerate(created_prs):
                  comment_lines.append(f"| {idx + 1} | **{p['title']}** | {p['author']} | {p['category']} | [View PR]({p['pr_url']}) |")

              comment_lines.append("")
              comment_lines.append("### Wallpaper Previews")
              for p in created_prs:
                  comment_lines.append(f"#### {p['title']}")
                  comment_lines.append(f"![{p['title']}]({p['img_url']})")
                  comment_lines.append("")

              if validation_errors:
                  comment_lines.append("---")
                  comment_lines.append("⚠️ **Notes on remaining items:**")
                  for err in validation_errors:
                      comment_lines.append(f"- {err}")
                  comment_lines.append("\n*You can reply directly to this issue with any missing image attachments to process them.*")

              comment_lines.append("\n**Review Status:** Pending maintainer review & approval. Once approved and merged into `main`, each wallpaper will immediately appear in the web catalog and KOReader Storefront plugin!")

          with open('issue_comment.md', 'w', encoding='utf-8') as cf:
              cf.write('\n'.join(comment_lines))
          PYEOF

      - name: Comment on Issue
        if: steps.process.outputs.valid == 'true' || steps.process.outputs.valid == 'false'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body-path: 'issue_comment.md'
