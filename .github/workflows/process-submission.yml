name: Process Wallpaper Submission

on:
  issues:
    types: [opened]

jobs:
  process-submission:
    if: contains(github.event.issue.title, 'Screensaver Submission')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Process Image and Update Catalog
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os, json, re, requests
          from PIL import Image
          from io import BytesIO

          body = os.environ.get('ISSUE_BODY', '')
          title_match = re.search(r'\*\*Title:\*\*\s*(.*)', body)
          author_match = re.search(r'\*\*Author:\*\*\s*(.*)', body)
          category_match = re.search(r'\*\*Category:\*\*\s*(.*)', body)
          url_match = re.search(r'\*\*Image URL:\*\*\s*(.*)', body)

          if not (title_match and url_match):
              print("Could not parse issue body")
              exit(0)

          title = title_match.group(1).strip()
          author = author_match.group(1).strip() if author_match else "Community"
          category = category_match.group(1).strip() if category_match else "General"
          img_url = url_match.group(1).strip()

          item_id = re.sub(r'[^a-z0-9]+', '-', title.lower()).strip('-')

          with open('screensavers.json', 'r') as f:
              catalog = json.load(f)

          new_entry = {
              "id": item_id,
              "title": title,
              "author": author,
              "category": category,
              "compatibility": ["Kindle", "Kobo", "Boox"],
              "thumbnailUrl": img_url,
              "fullUrl": img_url,
              "downloads": 0,
              "likes": 1
          }

          catalog.append(new_entry)

          with open('screensavers.json', 'w') as f:
              json.dump(catalog, f, indent=2)

          print(f"Added entry: {title}")
          EOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Add screensaver: ${{ github.event.issue.title }}"
          title: "New Screensaver Submission: ${{ github.event.issue.title }}"
          body: "Automated PR from issue #${{ github.event.issue.number }}"
          branch: "submission-${{ github.event.issue.number }}"
